<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>批次放行</title><style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}pre{background:#f3f5f7;padding:16px;overflow:auto}button{padding:8px 14px}.invalid{color:#b00020;font-weight:600}.valid{color:#1a7f37;font-weight:600}table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border:1px solid #d0d7de;padding:6px 10px;text-align:left}th{background:#f3f5f7}</style><h1>药品生产偏差与批次放行</h1><p>偏差、检验、返工、供应商变更和稳定性数据共同约束质量放行。批次交接后证据冻结，前厂只能追加回执；证据更新会让受影响的放行结论失效重算。</p><button onclick="loadState()">刷新状态</button><pre id="state">加载中...</pre><script>async function loadState(){
  const s=await (await fetch('/api/state')).json();
  let html='';
  html+='<h2>工厂</h2><table><tr><th>ID</th><th>代号</th><th>名称</th><th>国家</th></tr>';
  for(const f of s.factories) html+=`<tr><td>${f.id}</td><td>${f.code}</td><td>${f.name}</td><td>${f.country}</td></tr>`;
  html+='</table>';
  html+='<h2>批次</h2><table><tr><th>ID</th><th>批号</th><th>产品</th><th>状态</th><th>修订号</th><th>交接</th></tr>';
  for(const b of s.batches){
    const ho=s.handovers.find(h=>h.batch_id===b.id);
    let hoText='—';
    if(ho){
      const frozen=ho.evidence_frozen?'（证据已冻结）':'';
      hoText=`${ho.handover_no} ${ho.from_factory_id}→${ho.to_factory_id} [${ho.status}]${frozen}`;
    }
    html+=`<tr><td>${b.id}</td><td>${b.batch_no}</td><td>${b.product}</td><td>${b.state}</td><td>${b.revision}</td><td>${hoText}</td></tr>`;
  }
  html+='</table>';
  html+='<h2>交接记录</h2><table><tr><th>ID</th><th>交接单号</th><th>批次</th><th>前厂→新厂</th><th>状态</th><th>证据冻结</th><th>确认人</th></tr>';
  for(const h of s.handovers) html+=`<tr><td>${h.id}</td><td>${h.handover_no}</td><td>${h.batch_id}</td><td>${h.from_factory_id}→${h.to_factory_id}</td><td>${h.status}</td><td>${h.evidence_frozen?'是':'否'}</td><td>${h.confirmed_by||'—'}</td></tr>`;
  html+='</table>';
  html+='<h2>最近审计</h2><table><tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th><th>详情</th></tr>';
  for(const a of s.audits) html+=`<tr><td>${a.at}</td><td>${a.actor}</td><td>${a.action}</td><td>${a.entity_type}:${a.entity_id}</td><td>${a.details_json}</td></tr>`;
  html+='</table>';
  document.getElementById('state').innerHTML=html;
}
loadState()</script></html>
